openapi: 3.1.0
info:
  title: ELECTE Platform API
  version: 1.0.0
  summary: Read your ELECTE workspaces, data sources, reports, usage and webhooks.
  description: |
    The v1 API exposes the platform's own resources. Authentication is a platform
    API key sent as `Authorization: Bearer <key>`; create and revoke keys in the
    API keys panel at https://platform.electe.net. There is no password sign-in and
    no sign-up on this API.
    
    Rate limits are per key and enforced in Postgres, so `X-RateLimit-Limit`,
    `X-RateLimit-Remaining`, `X-RateLimit-Reset` and `Retry-After` are accurate
    across regions and survive a cold start.
    
    Errors are RFC 9457 problem documents (`application/problem+json`) carrying a
    stable `code`.
    
    v1 is read-only. Write routes arrive with the `reports:write` and
    `webhooks:write` scopes that already exist on a key.
  contact:
    name: ELECTE Support
    email: support@electe.net
    url: https://platform.electe.net
servers:
