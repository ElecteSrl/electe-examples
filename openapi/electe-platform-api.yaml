components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        A platform API key. Only its SHA-256 hash is stored, so a lost key cannot be
        recovered — revoke it and issue another in the platform's API keys panel.
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Stable machine-readable error code. }
        detail: { type: string }
      required: [type, title, status, code]
  responses:
    Unauthorized:
      description: 'The API key is missing, unknown, disabled or expired.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: 'The key does not carry the scope this route requires.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: 'No such resource, or this key cannot see it. The two are deliberately indistinguishable.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimited:
      description: 'The key exceeded its per-minute limit. Honour `Retry-After`.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InternalError:
      description: 'The request could not be completed.'
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
